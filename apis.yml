name: KGeN
description: >-
  KGeN (Kratos Gamer Network) is a verified-human data network powering Physical
  AI and Large Language Models across the Global South, and the operator of the
  KGeN Economy Protocols — a suite of developer APIs (Esports and Loyalty) that let
  game studios add leaderboard-based competitions and customizable reward systems
  paid in KCash, redeemable for real-world items at the Kratos Store. Server-to-server
  and per-user (JWT/OTP) endpoints cover sessions, tournaments, wallets, rewards, and
  rewardable events. Company revenue feeds $KGEN tokenomics, where every AI-data
  contract permanently retires token supply on-chain. Backed by Accel and Prosus
  Ventures.
